<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escudo de Kauntar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@600;700&family=Cormorant+Garamond:wght@500;600;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<script src="js/theme.js"></script>
</head>
<body>

<div class="gate" id="gateScreen" hidden>
  <form class="gate__card" id="gateForm">
    <img class="gate__mascot" src="img/mascot.png" alt="">
    <h1>Escudo de Kauntar</h1>
    <p class="muted">Entre com a sua conta para abrir o painel.</p>
    <label class="field">E-mail
      <input type="email" id="gateEmail" autocomplete="username" required>
    </label>
    <label class="field">Senha
      <input type="password" id="gatePassword" autocomplete="current-password" required>
    </label>
    <p class="form-msg" id="gateMsg" role="alert"></p>
    <button class="btn btn--primary" type="submit" id="gateSubmit">Entrar</button>
  </form>
</div>

<div id="painelScreen" hidden>
  <div class="topbar">
    <button class="theme-toggle" id="themeToggle" type="button"></button>
    <button class="btn" id="btnLogout" type="button">Sair</button>
  </div>

  <header class="masthead">
    <img class="masthead__mascot" src="img/mascot.png" alt="">
    <span class="masthead__word">Escudo de Kauntar</span>
    <p class="masthead__sub">Painel do Mestre</p>
  </header>

  <main class="painel">
    <p class="painel__hint">Arraste o cabeçalho de um card para qualquer célula da grade; o ícone de canto muda o tamanho.</p>
    <div class="grid" id="grid"></div>
  </main>

  <footer class="foot">Escudo de Kauntar · Lendas de Netéria</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/richtext.js"></script>
<script src="js/grid.js"></script>
<script src="js/data/races.js"></script>
<script>window.TOOLS = [];</script>
<script src="js/tools/wordcount.js"></script>
<script src="js/tools/notes.js"></script>
<script src="js/tools/travel.js"></script>
<script src="js/tools/equipment.js"></script>
<script src="js/tools/magicitems.js"></script>
<script src="js/tools/services.js"></script>
<script src="js/tools/spellcasting.js"></script>
<script src="js/tools/tavernprices.js"></script>
<script src="js/tools/npc.js"></script>
<script src="js/tools/rules.js"></script>
<script src="js/tools/search.js"></script>
<script src="js/app.js"></script>
</body>
</html>
